<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
      body { width: 300px; margin: 0; background: #0f141c; color: #e5e7eb; padding: 16px; }
      h1 { font-size: 18px; margin: 0 0 2px; color: #fff; }
      .sub { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }
      label { font-size: 12px; color: #cbd5e1; display: block; margin: 10px 0 4px; }
      input { width: 100%; background: #1b2432; border: 1px solid #273243; border-radius: 8px; padding: 9px 10px; color: #fff; font-size: 14px; outline: none; }
      input:focus { border-color: #6366f1; }
      button { width: 100%; margin-top: 14px; background: #6366f1; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
      button.ghost { background: #1b2432; border: 1px solid #273243; }
      .err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 16px; }
      .ok { color: #34d399; }
      .consent { font-size: 12px; line-height: 1.7; color: #cbd5e1; background: #111827; border: 1px solid #273243; border-radius: 8px; padding: 10px; }
      .hide { display: none; }
      .me { font-size: 14px; color: #fff; }
    </style>
  </head>
  <body>
    <h1>Khiam Ops</h1>
    <div class="sub">تسجيل دخول الموظف</div>

    <div id="loginView">
      <label>الكود</label>
      <input id="code" placeholder="مثال: K1002" autofocus />
      <label>رقم الواتساب</label>
      <input id="whatsapp" placeholder="+20…" dir="ltr" />
      <button id="loginBtn">دخول</button>
      <div class="err" id="err"></div>
    </div>

    <div id="consentView" class="hide">
      <div class="consent" id="consentText">
        هذا الجهاز مزوّد بنظام متابعة أداء يسجّل الرسائل والتعليقات والأوردرات وحالة العمل أثناء الشيفت،
        وقد تُلتقط لقطات شاشة أو بث مباشر للرقابة. بالموافقة تُقِرّ باطّلاعك.
      </div>
      <button id="consentBtn">موافق، ابدأ العمل</button>
    </div>

    <div id="sessionView" class="hide">
      <div class="me" id="who"></div>
      <div class="sub" id="whoSub"></div>
      <button class="ghost" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
